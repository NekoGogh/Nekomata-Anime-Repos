name: Build Extensions

on:
  push:
    branches: [main]
    paths-ignore:
      - "apk/**"
      - "index.json"
      - "index.min.json"
      - "index.html"
      - "icon/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-extensions
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "${SIGNING_KEY}" ]; then
            echo "${SIGNING_KEY}" | base64 -d > signingkey.jks
            echo "Using the keystore from the SIGNING_KEY secret."
          else
            echo "::warning::SIGNING_KEY is not configured. Generating an ephemeral keystore; future builds will have a different signature. See README.md."
            keytool -genkeypair \
              -keystore signingkey.jks \
              -alias key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Anime Extensions, OU=Extensions, O=Akrab, C=US"
          fi

      - name: Build release APKs
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p apk
          while IFS= read -r -d '' apk; do
            name="$(basename "$apk" | sed -E 's/-(release|unsigned|release-unsigned)\.apk$/.apk/')"
            cp "$apk" "apk/$name"
            echo "Collected apk/$name"
          done < <(find src -path '*/build/outputs/apk/release/*.apk' -print0)

      - name: Generate repository index
        run: python3 scripts/generate_index.py

      - name: Commit APKs and index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk index.json index.min.json index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: build extensions"
            git push
          fi
